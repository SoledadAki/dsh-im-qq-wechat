version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Host and QQ SDK contracts need deliberate compatibility review.
      - dependency-name: '@deepseek-ai/*'
      - dependency-name: '@tencent-connect/*'
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
