version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Host and QQ SDK contracts need deliberate compatibility review.
      - dependency-name: '@deepseek-ai/*'
      - dependency-name: '@tencent-connect/*'
      # Types track the supported Node floor (engines), not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
